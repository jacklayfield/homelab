name: Homelab CI

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Validate docker-compose
        run: docker compose -f docker/docker-compose.yml config

      - name: Check nginx config syntax
        run: docker run --rm -v $PWD/config/nginx.conf:/etc/nginx/nginx.conf:ro nginx:latest nginx -t