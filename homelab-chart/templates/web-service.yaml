apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab.fullname" . }}-web
  labels:
    {{- include "homelab.labels" . | nindent 4 }}
    component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "homelab.selectorLabels" . | nindent 4 }}
    component: web
