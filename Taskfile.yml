version: '3'

tasks:
  # Helm deployment tasks
  helm:install:
    desc: Install homelab Helm chart
    cmds:
      - helm install homelab ./homelab-chart --namespace default --create-namespace

  helm:upgrade:
    desc: Upgrade homelab Helm chart
    cmds:
      - helm upgrade homelab ./homelab-chart --namespace default

  helm:uninstall:
    desc: Uninstall homelab Helm chart
    cmds:
      - helm uninstall homelab --namespace default

  helm:values:
    desc: Show current Helm values
    cmds:
      - helm get values homelab --namespace default

  helm:template:
    desc: Preview Helm template rendering
    cmds:
      - helm template homelab ./homelab-chart

  # Monitoring stack tasks
  monitor:install:
    desc: Install monitoring stack (Prometheus + Grafana)
    cmds:
      - kubectl apply -f monitoring/namespace.yaml
      - kubectl apply -f monitoring/prometheus/
      - kubectl apply -f monitoring/grafana/
      - echo "Monitoring stack deployed to 'monitoring' namespace"

  monitor:uninstall:
    desc: Remove monitoring stack
    cmds:
      - kubectl delete -f monitoring/

  monitor:prometheus:
    desc: Port-forward to Prometheus (http://localhost:9090)
    cmds:
      - kubectl port-forward -n monitoring svc/prometheus 9090:9090

  monitor:grafana:
    desc: Port-forward to Grafana (http://localhost:3000)
    cmds:
      - kubectl port-forward -n monitoring svc/grafana 3000:3000

  openlens:install:
    desc: Install OpenLens dashboard
    cmds:
      - helm repo add openlens https://helm.openlens.org
      - helm repo update
      - kubectl create namespace openlens --dry-run=client -o yaml | kubectl apply -f -
      - helm upgrade --install openlens openlens/openlens --namespace openlens --create-namespace

  openlens:uninstall:
    desc: Remove OpenLens dashboard
    cmds:
      - helm uninstall openlens --namespace openlens --ignore-not-found
      - kubectl delete namespace openlens --ignore-not-found=true

  openlens:forward:
    desc: Port-forward OpenLens (http://localhost:3000)
    cmds:
      - kubectl -n openlens port-forward svc/openlens 3000:80

  robust:storage:
    desc: Deploy persistent storage infrastructure
    cmds:
      - kubectl apply -f kubernetes/storage-class.yaml
      - echo "Storage infrastructure deployed"
      - kubectl get storageclass,pv -o wide

  robust:network-policies:
    desc: Deploy network security policies
    cmds:
      - kubectl apply -f kubernetes/network-policies.yaml
      - echo "Network policies deployed"
      - kubectl get networkpolicies -A

  robust:tls:
    desc: Generate self-signed TLS certificate and create secret
    cmds:
      - |
        if ! command -v openssl &> /dev/null; then
          echo "Error: openssl is required. Install it and try again."
          exit 1
        fi
        echo "Generating self-signed certificate..."
        openssl req -x509 -newkey rsa:4096 -keyout tls.key -out tls.crt -days 365 -nodes -subj "/CN=homelab.local"
        echo "Certificate generated (tls.crt, tls.key)"
        echo "Creating Kubernetes secret..."
        kubectl create secret tls homelab-tls --cert=tls.crt --key=tls.key --namespace default --dry-run=client -o yaml | kubectl apply -f -
        echo "TLS secret created"
        kubectl get secrets homelab-tls -o jsonpath='{.metadata.namespace}/{.metadata.name}'
        echo ""

  robust:all:
    desc: Deploy all robustness features (storage, network policies, TLS)
    cmds:
      - task: robust:storage
      - echo ""
      - task: robust:network-policies
      - echo ""
      - task: robust:tls
      - echo ""
      - echo "✓ All robustness features deployed!"


  status:
    desc: Show overall cluster status
    cmds:
      - kubectl get pods -A
      - echo "---"
      - kubectl get svc -A
      - echo "---"
      - kubectl get ingress -A

  pods:
    desc: List all pods
    cmds:
      - kubectl get pods -A

  pods:default:
    desc: List pods in default namespace
    cmds:
      - kubectl get pods

  pods:monitoring:
    desc: List monitoring namespace pods
    cmds:
      - kubectl get pods -n monitoring

  svc:
    desc: List all services
    cmds:
      - kubectl get svc -A

  ingress:
    desc: List all ingresses
    cmds:
      - kubectl get ingress -A

  logs:app:
    desc: Tail application logs
    cmds:
      - kubectl logs -f deployment/homelab-web

  logs:api:
    desc: Tail API logs
    cmds:
      - kubectl logs -f deployment/homelab-api

  logs:prometheus:
    desc: Tail Prometheus logs
    cmds:
      - kubectl logs -f -n monitoring deployment/prometheus

  logs:grafana:
    desc: Tail Grafana logs
    cmds:
      - kubectl logs -f -n monitoring deployment/grafana

  # Deployment tasks
  deploy:
    desc: Deploy application with Helm
    cmds:
      - task: helm:upgrade
      - echo "Application deployed"

  deploy:all:
    desc: Deploy everything - robustness features + monitoring + application
    cmds:
      - echo "Deploying robustness features..."
      - task: robust:all
      - echo ""
      - echo "Deploying monitoring stack..."
      - task: monitor:install
      - echo ""
      - echo "Deploying application..."
      - task: deploy
      - echo ""
      - echo "✓ Full deployment complete!"

  # Cleanup tasks
  destroy:
    desc: Delete all resources (app + monitoring)
    cmds:
      - task: helm:uninstall
      - task: monitor:uninstall
      - echo "All resources destroyed"

  # Port forwarding shortcuts
  forward:grafana:
    desc: Forward Grafana port (default: 3000:3000)
    cmds:
      - kubectl port-forward -n monitoring svc/grafana 3000:3000

  forward:prometheus:
    desc: Forward Prometheus port (default: 9090:9090)
    cmds:
      - kubectl port-forward -n monitoring svc/prometheus 9090:9090

  forward:app:
    desc: Forward app service port (default: 8080:80)
    cmds:
      - kubectl port-forward svc/homelab-web 8080:80

  # Development helpers
  health:
    desc: Check health of all deployments
    cmds:
      - |
        echo "=== Default Namespace ==="
        kubectl get deployment -o wide
        echo "=== Monitoring Namespace ==="
        kubectl get deployment -n monitoring -o wide

  events:
    desc: Show recent cluster events
    cmds:
      - kubectl get events -A --sort-by='.lastTimestamp'

  describe:app:
    desc: Describe app deployment
    cmds:
      - kubectl describe deployment homelab-web

  describe:api:
    desc: Describe API deployment
    cmds:
      - kubectl describe deployment homelab-api

  describe:prometheus:
    desc: Describe Prometheus deployment
    cmds:
      - kubectl describe deployment -n monitoring prometheus

  describe:grafana:
    desc: Describe Grafana deployment
    cmds:
      - kubectl describe deployment -n monitoring grafana

  # Utility tasks
  robust:verify:
    desc: Verify robustness features are working
    cmds:
      - echo "=== Storage Status ==="
      - kubectl get pvc -A
      - echo ""
      - echo "=== Network Policies ==="
      - kubectl get networkpolicies -A
      - echo ""
      - echo "=== TLS Secret ==="
      - kubectl get secrets homelab-tls -o jsonpath='{.metadata.namespace}/{.metadata.name}' 2>/dev/null || echo "TLS secret not found"
      - echo ""
      - echo "=== Ingress TLS Status ==="
      - kubectl get ingress -o jsonpath='{.items[*].spec.tls}' 2>/dev/null || echo "No TLS configured"
      - echo ""

  lint:helm:
    desc: Lint Helm chart
    cmds:
      - helm lint ./homelab-chart

  validate:manifests:
    desc: Validate Kubernetes manifests
    cmds:
      - kubectl apply -f kubernetes/ --dry-run=client
      - kubectl apply -f monitoring/ --dry-run=client

  clean:
    desc: Clean up temporary files
    cmds:
      - find . -name "*.tmp" -delete
      - find . -name ".DS_Store" -delete
      - echo "Cleanup complete"

  help:
    desc: Show available tasks
    cmds:
      - task --list-all