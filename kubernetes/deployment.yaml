apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: homelab-web
  template:
    metadata:
      labels:
        app: homelab-web
    spec:
      containers:
        - name: web
          image: ghcr.io/jacklayfield/homelab-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10