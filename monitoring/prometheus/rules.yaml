apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: homelab-alerts
        interval: 30s
        rules:
          # Pod alerts
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[30m]) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Pod crash looping detected"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"

          - alert: PodNotHealthy
            expr: min_over_time(sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})[15m:1m]) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod not healthy"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not healthy"

          # Container alerts
          - alert: ContainerHighCpuUsage
            expr: (sum(rate(container_cpu_usage_seconds_total[5m])) by (pod, namespace) / sum(container_spec_cpu_quota/container_spec_cpu_period) by (pod, namespace)) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Container high CPU usage"
              description: "Container {{ $labels.pod }} in namespace {{ $labels.namespace }} has high CPU usage"

          - alert: ContainerHighMemoryUsage
            expr: (sum(container_memory_working_set_bytes) by (pod, namespace) / sum(container_spec_memory_limit_bytes > 0) by (pod, namespace)) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Container high memory usage"
              description: "Container {{ $labels.pod }} in namespace {{ $labels.namespace }} has high memory usage"

          # Node alerts
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node not ready"
              description: "Node {{ $labels.node }} is not ready"

          - alert: NodeHighCpuUsage
            expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node high CPU usage"
              description: "Node {{ $labels.node }} CPU usage is above 80%"

          - alert: NodeHighMemoryUsage
            expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node high memory usage"
              description: "Node {{ $labels.node }} memory usage is above 80%"
